name: Update thrm-bin

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump to latest upstream release
        id: bump
        run: |
          chmod +x update.sh
          before=$(git status --porcelain)
          ./update.sh
          after=$(git status --porcelain)
          if [[ "$before" != "$after" ]] && [[ -n "$after" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push (GitHub)
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          git add PKGBUILD .SRCINFO
          git commit -m "chore: bump thrm-bin to ${ver}"
          git push

      - name: Publish to AUR
        if: steps.bump.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${AUR_SSH_PRIVATE_KEY}" ]] || { echo "missing secret AUR_SSH_PRIVATE_KEY" >&2; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'

          aur_dir=$(mktemp -d)
          if ! git clone ssh://aur@aur.archlinux.org/thrm-bin.git "$aur_dir"; then
            ssh -i ~/.ssh/aur -o IdentitiesOnly=yes aur@aur.archlinux.org setup-repo thrm-bin
            git clone ssh://aur@aur.archlinux.org/thrm-bin.git "$aur_dir"
          fi

          cp PKGBUILD .SRCINFO "$aur_dir/"
          cd "$aur_dir"
          git config user.name 'Jochem Kuipers'
          git config user.email 'jochem@kuipers.cc'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already up to date"
            exit 0
          fi

          ver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          rel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
          git commit -m "Update to ${ver}-${rel}"
          git push

